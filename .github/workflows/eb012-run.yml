name: EB012 gate run
# Start the OBSERVER workflow first (same mode and suffix), wait about 1 minute, then run this one. Run id = <mode>-<suffix>.
run-name: "EB012 / ${{ inputs.mode }} / ${{ inputs.mode }}-${{ inputs.suffix }}"
on:
  workflow_dispatch:
    inputs:
      mode: {description: "g-faithful, g-retarget, g-mutate-body, g-extra-effect, g-forged-auth, g-replay, g-overbroad-spec or b-retarget", required: true}
      suffix: {description: "Same suffix as the setup run, e.g. r1", required: true}
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, issues: read}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GATE_KEY: ${{ secrets.GATE_KEY }}
      MODE: ${{ inputs.mode }}
      SUFFIX: ${{ inputs.suffix }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I agent/eb012_gate.py authorize --mode "$MODE" --suffix "$SUFFIX" --out auth.json
      - uses: actions/upload-artifact@v4
        with: {name: "auth-${{ inputs.mode }}-${{ inputs.suffix }}", path: auth.json}
  handler:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, issues: read}
    env:
      # UNTRUSTED handler: no key. Write token ONLY in bypass mode (b-*), to model a weak architecture.
      GITHUB_TOKEN: ${{ startsWith(inputs.mode, 'b-') && secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      SUFFIX: ${{ inputs.suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: "auth-${{ inputs.mode }}-${{ inputs.suffix }}"}
      - run: python3 -I agent/eb012_gate.py handler --mode "$MODE" --suffix "$SUFFIX" --auth auth.json --out request.json
      - uses: actions/upload-artifact@v4
        with: {name: "request-${{ inputs.mode }}-${{ inputs.suffix }}", path: request.json}
  gate:
    needs: handler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
      GATE_KEY: ${{ secrets.GATE_KEY }}
      MODE: ${{ inputs.mode }}
      SUFFIX: ${{ inputs.suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: "auth-${{ inputs.mode }}-${{ inputs.suffix }}"}
      - uses: actions/download-artifact@v4
        with: {name: "request-${{ inputs.mode }}-${{ inputs.suffix }}"}
      - name: Gate
        run: python3 -I agent/eb012_gate.py gate --mode "$MODE" --suffix "$SUFFIX" --auth auth.json --request request.json --out gate_log.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "gate-log-${{ inputs.mode }}-${{ inputs.suffix }}", path: gate_log.json, if-no-files-found: ignore}

