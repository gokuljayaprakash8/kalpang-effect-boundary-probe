name: EB009 agent probe
# Experiment 009. A scripted agent creates its authorized issue per trial while another actor may also act.
# Start the OBSERVER workflow first, then run this one with the same mode and run_id.
run-name: "EB009 / ${{ inputs.mode }} / ${{ inputs.run_id }}"
on:
  workflow_dispatch:
    inputs:
      mode: {description: "solo, other-human, other-human-spoof, or other-bot", required: true}
      run_id: {description: "Fresh run id, e.g. s1 (letters, digits, . _ -)", required: true}
      trials: {description: "Number of trials (1-10)", required: true, default: "3"}
permissions:
  contents: read
  issues: write
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      RUN_ID: ${{ inputs.run_id }}
      TRIALS: ${{ inputs.trials }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the scripted agent
        run: python3 -I agent/eb009_agent.py agent --mode "$MODE" --run-id "$RUN_ID" --trials "$TRIALS" --out agent_log.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eb009-agent-${{ inputs.run_id }}
          path: agent_log.json
          if-no-files-found: ignore
  bystander:
    if: ${{ inputs.mode == 'other-bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Second job creates an unrelated issue with the same token
        run: python3 -I agent/eb009_agent.py bystander --mode "$MODE" --run-id "$RUN_ID" --delay 15 --out bystander.json
