name: Effect-boundary REST probe (Experiment 003)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-rest-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run controlled REST experiment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import parse_qs, urlparse
          from urllib.request import Request, urlopen
          from urllib.error import URLError

          # Controlled in-memory REST service. The executor-facing target endpoint
          # does not include side-effect records. A separate observer endpoint does.
          # Both endpoints intentionally remain in the same local trust domain.
          STORE_LOCK = threading.Lock()
          TARGETS = {}
          EFFECTS = []

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass

              def send_json(self, status, payload):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  parsed = urlparse(self.path)
                  if parsed.path == "/health":
                      self.send_json(200, {"status": "ok"})
                      return

                  target_match = re.fullmatch(r"/v1/targets/([A-Za-z0-9._-]+)", parsed.path)
                  if target_match:
                      run_id = target_match.group(1)
                      with STORE_LOCK:
                          target = TARGETS.get(run_id)
                      if target is None:
                          self.send_json(404, {"error": "target_not_found"})
                      else:
                          self.send_json(200, {"target": target})
                      return

                  if parsed.path == "/v1/effects":
                      run_id = parse_qs(parsed.query).get("run_id", [""])[0]
                      with STORE_LOCK:
                          effects = [e.copy() for e in EFFECTS if e["run_id"] == run_id]
                      self.send_json(200, {"effects": effects})
                      return

                  self.send_json(404, {"error": "not_found"})

              def do_POST(self):
                  if self.path != "/v1/execute":
                      self.send_json(404, {"error": "not_found"})
                      return
                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                      request_data = json.loads(self.rfile.read(length).decode("utf-8"))
                  except (ValueError, json.JSONDecodeError):
                      self.send_json(400, {"error": "invalid_json"})
                      return

                  run_id = request_data.get("run_id")
                  scenario = request_data.get("scenario")
                  if (not isinstance(run_id, str)
                      or not re.fullmatch(r"[A-Za-z0-9._-]{3,80}", run_id)
                      or scenario not in {"normal", "extra-effect", "target-mismatch"}):
                      self.send_json(400, {"error": "invalid_run_id_or_scenario"})
                      return

                  with STORE_LOCK:
                      if run_id in TARGETS:
                          self.send_json(409, {"error": "duplicate_run_id"})
                          return
                      target = {
                          "run_id": run_id,
                          "title": f"resource-{run_id}",
                          "body": "approved body",
                          "state": "open",
                      }
                      if scenario == "target-mismatch":
                          target["body"] = "unexpected mutated body"
                      TARGETS[run_id] = target

                      # Simulated server-side trigger effect. It is intentionally
                      # excluded from the target read-back response.
                      if scenario == "extra-effect":
                          EFFECTS.append({
                              "run_id": run_id,
                              "effect_type": "secondary_record_created",
                              "resource_id": f"secondary-{run_id}",
                          })

                  # The executor response acknowledges the request but does not
                  # disclose the additional effect.
                  self.send_json(201, {"accepted": True, "run_id": run_id})

          def http_json(method, url, payload=None):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              request = Request(url, data=body, method=method)
              if body is not None:
                  request.add_header("Content-Type", "application/json")
              with urlopen(request, timeout=3) as response:
                  return json.loads(response.read().decode("utf-8"))

          def observe_target(base_url, run_id):
              # Observer A: reads only the requested target resource.
              data = http_json("GET", f"{base_url}/v1/targets/{run_id}")
              target = data["target"]
              matches = (
                  target.get("title") == f"resource-{run_id}"
                  and target.get("body") == "approved body"
                  and target.get("state") == "open"
              )
              return "MATCH" if matches else "NONMATCH"

          def observe_effect_inventory(base_url, run_id):
              # Observer B: separate client function reading the effect inventory API.
              data = http_json("GET", f"{base_url}/v1/effects?run_id={run_id}")
              return len([e for e in data.get("effects", []) if e.get("run_id") == run_id])

          server = ThreadingHTTPServer(("127.0.0.1", 8765), Handler)
          server_thread = threading.Thread(target=server.serve_forever, daemon=True)
          server_thread.start()
          base_url = "http://127.0.0.1:8765"
          try:
              for attempt in range(30):
                  try:
                      http_json("GET", f"{base_url}/health")
                      break
                  except (URLError, TimeoutError, ConnectionError):
                      if attempt == 29:
                          raise RuntimeError("REST service did not become healthy")
                      time.sleep(0.1)

              cases = [
                  {"scenario": "normal", "run_id": "EB003-NORMAL", "expected_target": "MATCH", "expected_effects": 0},
                  {"scenario": "extra-effect", "run_id": "EB003-EXTRA", "expected_target": "MATCH", "expected_effects": 1},
                  {"scenario": "target-mismatch", "run_id": "EB003-MISMATCH", "expected_target": "NONMATCH", "expected_effects": 0},
              ]
              reports = []
              all_pass = True
              for case in cases:
                  http_json("POST", f"{base_url}/v1/execute", {
                      "run_id": case["run_id"],
                      "scenario": case["scenario"],
                  })
                  target_result = observe_target(base_url, case["run_id"])
                  effect_count = observe_effect_inventory(base_url, case["run_id"])
                  inventory_result = "DEVIATION_FOUND" if effect_count else "NO_MARKED_EXTRA_EFFECT_FOUND"
                  passed = (
                      target_result == case["expected_target"]
                      and effect_count == case["expected_effects"]
                  )
                  all_pass = all_pass and passed
                  reports.append({
                      "scenario": case["scenario"],
                      "run_id": case["run_id"],
                      "target_result": target_result,
                      "expected_target": case["expected_target"],
                      "inventory_result": inventory_result,
                      "effect_count": effect_count,
                      "expected_effects": case["expected_effects"],
                      "verdict": "PASS" if passed else "FAIL",
                  })

              print("Experiment 003: controlled REST effect-boundary checks")
              for report in reports:
                  print(json.dumps(report, sort_keys=True))
              print("Scope: local synthetic REST service; two observer functions; same host/process trust domain.")
              print("Limitation: this is not an external-service test, independent trust domain, complete effect inventory, or novelty proof.")
              print("Overall verdict:", "PASS" if all_pass else "FAIL")

              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary:
                      summary.write("## Experiment 003: Controlled REST effect-boundary checks\n\n")
                      summary.write("| Scenario | Target observer | Effect inventory | Count | Verdict |\n")
                      summary.write("|---|---|---|---:|---|\n")
                      for report in reports:
                          summary.write(
                              f"| {report['scenario']} | {report['target_result']} (expected {report['expected_target']}) "
                              f"| {report['inventory_result']} | {report['effect_count']} (expected {report['expected_effects']}) "
                              f"| {report['verdict']} |\n"
                          )
                      summary.write("\n**Overall verdict:** " + ("PASS" if all_pass else "FAIL") + "\n\n")
                      summary.write("**Scope and limitations:** This is a local synthetic REST service. The target and effect observers use separate endpoints/functions but share the same host and service trust domain. This is not a complete effect inventory, independent trust domain, external-service result, or novelty proof.\n")
              if not all_pass:
                  raise SystemExit(1)
          finally:
              server.shutdown()
              server.server_close()
              server_thread.join(timeout=1)
          PY
          
