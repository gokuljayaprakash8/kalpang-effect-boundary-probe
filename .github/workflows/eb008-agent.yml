name: EB008 agent probe
# Experiment 008. A scripted agent (no LLM) creates the authorized issue per trial, optionally with an extra issue.
# Start the OBSERVER workflow first, then run this one with the same mode and run_id.
run-name: "EB008 / ${{ inputs.mode }} / ${{ inputs.run_id }}"
on:
  workflow_dispatch:
    inputs:
      mode: {description: "benign, extra-logged, or extra-unlogged", required: true}
      run_id: {description: "Fresh run id, e.g. r1 (letters, digits, . _ -)", required: true}
      trials: {description: "Number of trials (1-10)", required: true, default: "5"}
permissions:
  contents: read
  issues: write
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      RUN_ID: ${{ inputs.run_id }}
      TRIALS: ${{ inputs.trials }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the scripted agent
        run: python3 -I agent/eb008_scripted.py --mode "$MODE" --run-id "$RUN_ID" --trials "$TRIALS" --out agent_log.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eb008-agent-${{ inputs.run_id }}
          path: agent_log.json
          if-no-files-found: ignore
