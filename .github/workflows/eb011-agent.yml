name: EB011 agent probe
# Start the OBSERVER workflow first (same mode and suffix), then this one. Run id = <mode>-<suffix>.
run-name: "EB011 / ${{ inputs.mode }} / ${{ inputs.mode }}-${{ inputs.suffix }}"
on:
  workflow_dispatch:
    inputs:
      mode: {description: "faithful, retarget, mutate-body, extra-effect, false-success, unmonitored or edit-existing", required: true}
      suffix: {description: "Same suffix as the setup run, e.g. r1", required: true}
permissions:
  contents: read
  issues: write
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
      MODE: ${{ inputs.mode }}
      SUFFIX: ${{ inputs.suffix }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I agent/eb011_agent.py agent --mode "$MODE" --suffix "$SUFFIX" --out agent_log.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "eb011-agent-${{ inputs.mode }}-${{ inputs.suffix }}", path: agent_log.json, if-no-files-found: ignore}

