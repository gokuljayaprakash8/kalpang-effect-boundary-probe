name: EB010 agent probe
# Experiment 010. The agent acts with its OWN token (secret AGENT_PAT); the bystander acts either with the
# platform token (sep-*) or with the agent's own token (shared-*).
# Start the OBSERVER workflow first, then run this one with the same mode and run_id.
run-name: "EB010 / ${{ inputs.mode }} / ${{ inputs.run_id }}"
on:
  workflow_dispatch:
    inputs:
      mode: {description: "sep-bot, sep-bot-spoof, shared-bot or shared-spoof", required: true}
      run_id: {description: "Fresh run id, e.g. a1 (letters, digits, . _ -)", required: true}
      trials: {description: "Number of trials (1-10)", required: true, default: "3"}
      delay: {description: "Seconds before the bystander acts", required: true, default: "15"}
permissions:
  contents: read
  issues: write
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
      MODE: ${{ inputs.mode }}
      RUN_ID: ${{ inputs.run_id }}
      TRIALS: ${{ inputs.trials }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the scripted agent with its own token
        run: python3 -I agent/eb010_agent.py agent --mode "$MODE" --run-id "$RUN_ID" --trials "$TRIALS" --out agent_log.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eb010-agent-${{ inputs.run_id }}
          path: agent_log.json
          if-no-files-found: ignore
  bystander:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ startsWith(inputs.mode, 'shared') && secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      RUN_ID: ${{ inputs.run_id }}
      DELAY: ${{ inputs.delay }}
    steps:
      - uses: actions/checkout@v4
      - name: Second job creates an issue
        run: python3 -I agent/eb010_agent.py bystander --mode "$MODE" --run-id "$RUN_ID" --delay "$DELAY" --out bystander.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eb010-bystander-${{ inputs.run_id }}
          path: bystander.json
          if-no-files-found: ignore

